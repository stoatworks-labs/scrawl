  <body>
    <main id="demo">
      <noscript>
        <h1>Scrawl</h1>
        <p>
          Two FFGL plugins, a source and an effect that draws over your clip,
          that doodle the music into the air: rings of sound on the kick, impact
          stars on the snare, zigzag bolts on the big hits, curls off the
          hi-hats, and one long wobbly line that's the spectrum. Every doodle is
          drawn again for every drawing, 24, 12 or 8 times a second, by a hand
          that can't hold still, so every line boils the way hand-drawn
          animation does. It listens to Resolume's audio input, and follows the
          beat when there's nothing to hear.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/scrawl">its repository</a>.
        </p>
